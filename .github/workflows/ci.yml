name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install pip-audit ruff==0.15.22
      - run: ruff check app --select E4,E7,E9,F,I
      - run: pip-audit .
      - run: pytest app/tests -q
      - run: python -m compileall app

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run i18n:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=moderate

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  benchmark-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install .
      - run: python -c "from app.services.evaluation.benchmark import BaselineEvaluator; from app.schemas.evaluation import EvaluationRequest; print(BaselineEvaluator().evaluate(EvaluationRequest()).summary)"

  foundation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: pip install -e "apps/api[dev]"
      - run: python -m pip install pytest-timeout
      - run: npm ci --prefix apps/web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run check:all
