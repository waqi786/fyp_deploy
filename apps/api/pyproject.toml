[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resora-api"
version = "0.1.0"
description = "Resora API service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "redis>=5.2,<6.0",
  "google-auth>=2.35,<3.0",
  "python-dotenv>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pytest>=9.0.3,<10.0",
  "python-multipart>=0.0.9,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "pytesseract>=0.3,<1.0",
  "Pillow>=13.0.0,<14.0",
]

[project.scripts]
resora = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-timeout>=2.3,<3.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
timeout = 60
markers = [
  "integration: marks tests that hit live upstream services",
  "live: marks tests that require external providers or network and are skipped by default",
]
