<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Send to Resora</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 12px; width: 320px; background: #10212b; color: #f5ecd8; }
      button { width: 100%; padding: 10px; border: 0; background: #f3b664; color: #10212b; font-weight: 700; cursor: pointer; }
      textarea { width: 100%; min-height: 90px; margin: 10px 0; background: #173241; color: #f5ecd8; border: 1px solid #335464; }
      small { display: block; margin-top: 8px; opacity: 0.8; }
    </style>
  </head>
  <body>
    <h3>Send to Resora</h3>
    <textarea id="selection" placeholder="Optional note or selected text"></textarea>
    <button id="send">Save Current Tab</button>
    <small id="status">Ready</small>
    <script src="popup.js"></script>
  </body>
</html>
