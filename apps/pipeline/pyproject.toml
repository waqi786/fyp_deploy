[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resora-pipeline"
version = "1.0.0"
description = "Resora research data pipeline: collectors, Data Lake, Spark ETL, deduplication, analytics, search index"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0", "numpy>=1.26"]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.1"]
s3 = ["boto3>=1.34"]
kafka = ["kafka-python>=2.0"]
faiss = ["faiss-cpu>=1.8"]
semantic = ["sentence-transformers>=3.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = ["pytest>=8.2,<9.0"]

[project.scripts]
resora-pipeline = "resora_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["resora_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs pyspark and a Java runtime (skipped when unavailable)"]
