version: "3.9"

services:
  api:
    build:
      context: ../apps/api
    env_file:
      - ../.env.production.example
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  worker:
    build:
      context: ../apps/api
    command: python -m app.workers.runner
    env_file:
      - ../.env.production.example
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started

  web:
    build:
      context: ../apps/web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resora}
      POSTGRES_USER: ${POSTGRES_USER:-resora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
