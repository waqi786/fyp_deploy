version: "3.9"

services:
  api:
    build:
      context: ../apps/api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ../apps/api
    command: python -m app.workers.runner
    env_file:
      - ../.env.example
    volumes:
      - ../apps/api:/app
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../apps/web
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resora
      POSTGRES_USER: resora
      POSTGRES_PASSWORD: resora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
