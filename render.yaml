services:
  - type: web
    name: resora-demo-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: apps/api
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DEPLOYMENT_STAGE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resora-demo-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://resora-fyp-team-demo.vercel.app
      - key: AI_ROUTER_FREE_MODELS_ONLY
        value: "true"
      - key: API_CONTACT_EMAIL
        value: support@resora.local
      - key: UNPAYWALL_EMAIL
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false

databases:
  - name: resora-demo-db
    databaseName: resora_demo
    user: resora_demo
    plan: free
    region: singapore
    postgresMajorVersion: "16"
